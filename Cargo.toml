[package]
name = "parquet-parser"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
default-run = "parquet-parser"

[dependencies]
anyhow = "1.0.102"
bytes = "1.11.1"
thrift = { version = "0.17.0", default-features = false }
polars = { version = "0.53.0", default-features = false, features = [
  "fmt",
  "parquet",
  "lazy",
] }
snap = "1.1.1"
clap = { version = "4.6.1", features = ["derive"] }
arrow = { version = "58.1.0" }
parquet = { version = "58.1.0", features = ["arrow", "snap"] }

[dev-dependencies]
ctor = "0.12.0"
insta = "1.47.2"
rstest = "0.26.1"
tempfile = "3.27.0"
